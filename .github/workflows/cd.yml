name: CD - Data Engineering Pipeline

on:
  workflow_run:
    workflows: ["CI - Data Engineering Pipeline"]  # ✅ nom exact de ton ci.yml
    types:
      - completed
    branches:
      - main
      - master

jobs:
  # ─────────────────────────────────────────
  # 1. Build & Push l'image sur Docker Hub
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/projetdataengineer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/projetdataengineer:${{ github.sha }}

  # ─────────────────────────────────────────
  # 2. Deploy sur le serveur via SSH
  # ─────────────────────────────────────────
  deploy:
    name: Deploy on server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into server & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     22
          script: |
            cd /opt/projetdataengineer

            # Injecter les secrets dans le .env du serveur
            echo "DB_USER=${{ secrets.DB_USER }}" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

            # Récupérer la nouvelle image
            docker compose pull

            # Redémarrer les services
            docker compose up -d --remove-orphans

            # Nettoyage des anciennes images
            docker image prune -f

            echo "✅ Déploiement terminé : $(date)"
